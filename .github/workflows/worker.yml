# Deploys the Telegram relay (worker/) to Cloudflare Workers.
# The hosting on reg.ru and Telegram cannot reach each other; both reach Cloudflare.
name: Worker

# One relay for both sites: BOT_URL in worker/wrangler.toml picks the site, so any branch
# that changes worker/ deploys it.
on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # API token with the "Edit Cloudflare Workers" template; account id from the dashboard.
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
