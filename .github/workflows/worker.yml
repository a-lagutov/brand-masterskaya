# Deploys the Bot API relay (worker/) to Cloudflare Workers: from reg.ru, IPv4 connections to
# api.telegram.org hang, while Cloudflare answers at once.
name: Worker

# One relay for both bots, so any branch that changes worker/ deploys it.
on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

# Read-only token: jobs only check out code; deploys use their own secrets.
permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # API token with the "Edit Cloudflare Workers" template; account id from the dashboard.
      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
