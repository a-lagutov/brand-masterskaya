# Runs lint, format check and build on every pull request.
name: CI

on:
  pull_request:

# Read-only token: jobs only check out code; deploys use their own secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and format check
        run: npm run check

      - name: Build
        run: npm run build

      # Payment endpoints are copied to the hosting as is; catch syntax errors here.
      - name: PHP syntax
        run: for file in src/api/*.php config.example.php; do php -l "$file"; done
