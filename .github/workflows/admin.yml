# Builds the admin panel with the Telegram bot (admin/) and deploys it to reg.ru:
# - push to main -> admin.brandmasterskaya.ru, the live bot, orders of brandmasterskaya.ru;
# - push to any other branch -> admin.test.brandmasterskaya.ru, the test bot, orders of the test site.
#
# The hosting kills processes that listen on TCP ports and runs only Python apps under
# Passenger, so admin/deploy/passenger_wsgi.py starts the Node app on a unix socket and proxies
# to it. The site needs "PHP" and "Python" enabled in the reg.ru panel.
name: Admin

on:
  push:
    paths:
      - 'admin/**'
      - 'src/cabinet/**'
      - '.github/workflows/admin.yml'
  # Typecheck and build of every pull request, Dependabot's too; see the check job.
  pull_request:
    paths:
      - 'admin/**'
      - 'src/cabinet/**'
      - '.github/workflows/admin.yml'
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Read safe test-login failure stages without deploying
        type: boolean
        default: false

# Read-only token: jobs only check out code; deploys use their own secrets.
permissions:
  contents: read

env:
  LIVE: ${{ github.ref == 'refs/heads/main' }}
  ADMIN_SITE: ${{ github.ref == 'refs/heads/main' && 'admin.brandmasterskaya.ru' || 'admin.test.brandmasterskaya.ru' }}
  SITE: ${{ github.ref == 'refs/heads/main' && 'brandmasterskaya.ru' || 'test.brandmasterskaya.ru' }}
  NODE_VERSION: '22.20.0'

concurrency:
  # Pull request checks have their own group, so they never queue behind a deploy.
  group: admin-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || (github.ref == 'refs/heads/main' && 'live' || 'test') }}
  cancel-in-progress: false

jobs:
  # Same typecheck and build as the deploy, without secrets, so it also runs for Dependabot.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # A throwaway database: the build must not touch a real one.
      - name: Build
        env:
          DATABASE_URL: file:/tmp/build.db
          PAYLOAD_SECRET: build-only
        run: npm run build

  deploy:
    # Dependabot gets no repository secrets, so its branches cannot deploy; the check job covers
    # them. Pull requests are only checked, never deployed.
    if: github.event_name != 'pull_request' && github.actor != 'dependabot[bot]' && inputs.diagnostics_only != true
    # Shows each deploy under Deployments on GitHub: admin, live from main, test from other branches.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'admin-production' || 'admin-test' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://admin.brandmasterskaya.ru/admin' || 'https://admin.test.brandmasterskaya.ru/admin' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # The build needs about 3 GB of memory, more than the hosting gives a process.
      # A throwaway database: the build must not touch the real one.
      - name: Build
        env:
          DATABASE_URL: file:/tmp/build.db
          PAYLOAD_SECRET: build-only
        run: npm run build

      # The standalone server with its static files and the socket preload: about 2 000 files.
      - name: Assemble bundle
        run: |
          mkdir -p bundle
          cp -R .next/standalone/. bundle/
          mkdir -p bundle/.next
          cp -R .next/static bundle/.next/static
          cp deploy/listen-unix.cjs bundle/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          echo "SERVER=${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" >> "$GITHUB_ENV"

      - name: Diagnose test OAuth connectivity
        if: github.ref != 'refs/heads/main'
        run: ssh -i ~/.ssh/deploy_key "$SERVER" '~/apps/node/bin/node -' < deploy/diagnose-oauth.mjs

      # Keep an online SQLite snapshot before the new app can apply migrations.
      - name: Backup database
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER" "python3 - '$ADMIN_SITE'" <<'PYTHON'
          """Back up only the target environment before deployment."""
          import datetime
          import pathlib
          import sqlite3
          import sys

          private_directory = pathlib.Path.home() / 'private' / sys.argv[1]
          database_path = private_directory / 'payload.db'
          if database_path.exists():
              backup_directory = private_directory / 'backups'
              backup_directory.mkdir(mode=0o700, parents=True, exist_ok=True)
              timestamp = datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')
              backup_path = backup_directory / ('payload-' + timestamp + '.db')
              with sqlite3.connect(str(database_path)) as source_database:
                  if hasattr(source_database, 'backup'):
                      with sqlite3.connect(str(backup_path)) as backup_database:
                          source_database.backup(backup_database)
                  else:
                      # The hosting's Python predates sqlite3.Connection.backup.
                      backup_path = backup_directory / ('payload-' + timestamp + '.sql')
                      source_database.execute('BEGIN')
                      with backup_path.open('w', encoding='utf-8') as backup_file:
                          for statement in source_database.iterdump():
                              backup_file.write(statement + chr(10))
              backup_path.chmod(0o600)
              print('Database backup created: ' + backup_path.name)
          else:
              print('No existing database to back up.')
          PYTHON

      # Node from nodejs.org into ~/apps/node; the hosting's own node is too old.
      - name: Install Node.js on the server
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER" "set -e
            if [ \"\$(~/apps/node/bin/node -v 2>/dev/null)\" != v$NODE_VERSION ]; then
              mkdir -p ~/apps && cd ~/apps
              curl -sSfL https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz | tar -xJ
              rm -rf node && mv node-v$NODE_VERSION-linux-x64 node
              # Only the binary is needed; npm and headers would add 5 000 files.
              rm -rf node/include node/lib node/share
            fi
            ~/apps/node/bin/node -v"

      # Install and exercise private tools before allowing the test queue to consume uploads.
      - name: Install test media tools
        if: github.ref != 'refs/heads/main' && (vars.TEST_RUN_LECTURE_WORKER || '1') == '1'
        run: |
          bash deploy/prepare-media-tools.sh media-tools
          ssh -i ~/.ssh/deploy_key "$SERVER" "mkdir -p apps/$ADMIN_SITE/media && chmod 700 apps/$ADMIN_SITE/media"
          rsync -az -e "ssh -i ~/.ssh/deploy_key" media-tools/ "$SERVER:apps/$ADMIN_SITE/media/"
          scp -i ~/.ssh/deploy_key tests/fixtures/lecture.mp4 "$SERVER:apps/$ADMIN_SITE/media/fixture.mp4"
          ssh -i ~/.ssh/deploy_key "$SERVER" "python3 - '$ADMIN_SITE'" < deploy/verify-media-tools.py

      # Secrets and paths for the app, outside the web root; read by passenger_wsgi.py.
      - name: Write app settings
        env:
          PAYLOAD_SECRET: ${{ secrets.ADMIN_PAYLOAD_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.TG_BOT_MASTERSKAYA_TOKEN || secrets.TG_TESTBOT_MASTERSKAYA_TOKEN }}
          # Cloudflare relay from worker/: IPv4 connections from reg.ru to api.telegram.org hang.
          TELEGRAM_API_URL: ${{ vars.TELEGRAM_API_URL }}
          CABINET_SECRET: ${{ github.ref == 'refs/heads/main' && secrets.CABINET_SECRET || github.ref != 'refs/heads/main' && secrets.TEST_CABINET_SECRET || '' }}
          TELEGRAM_LOGIN_CLIENT_ID: ${{ github.ref == 'refs/heads/main' && vars.TELEGRAM_LOGIN_CLIENT_ID || github.ref != 'refs/heads/main' && vars.TEST_TELEGRAM_LOGIN_CLIENT_ID || '' }}
          TELEGRAM_LOGIN_CLIENT_SECRET: ${{ github.ref == 'refs/heads/main' && secrets.TELEGRAM_LOGIN_CLIENT_SECRET || github.ref != 'refs/heads/main' && secrets.TEST_TELEGRAM_LOGIN_CLIENT_SECRET || '' }}
          RUN_LECTURE_WORKER: ${{ github.ref == 'refs/heads/main' && vars.RUN_LECTURE_WORKER || github.ref != 'refs/heads/main' && (vars.TEST_RUN_LECTURE_WORKER || '1') || '' }}
          FFMPEG_PATH: ${{ vars.FFMPEG_PATH }}
          SHAKA_PACKAGER_PATH: ${{ vars.SHAKA_PACKAGER_PATH }}
        run: |
          node -e '
            const home = process.argv[1];
            const privateDir = `${home}/private/${process.env.ADMIN_SITE}`;
            process.stdout.write(JSON.stringify({
              DATABASE_URL: `file:${privateDir}/payload.db`,
              PAYLOAD_SECRET: process.env.PAYLOAD_SECRET,
              ADMIN_EMAIL: "contact@brandmasterskaya.ru",
              ADMIN_PASSWORD: process.env.ADMIN_PASSWORD,
              TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN,
              TELEGRAM_API_URL: process.env.TELEGRAM_API_URL,
              RUN_BOT: "1",
              ORDERS_DIR: `${home}/private/${process.env.SITE}/orders`,
              PRICES_FILE: `${home}/www/${process.env.SITE}/api/prices.json`,
              PRICE_OVERRIDES_FILE: `${home}/private/${process.env.SITE}/prices.json`,
              PROMO_CODES_FILE: `${home}/private/${process.env.SITE}/promocodes.json`,
              SITE_SETTINGS_FILE: `${home}/private/${process.env.SITE}/site-settings.json`,
              SITE_URL: `https://${process.env.SITE}`,
              CABINET_URL: `https://${process.env.SITE}`,
              CABINET_SECRET: process.env.CABINET_SECRET,
              TELEGRAM_LOGIN_CLIENT_ID: process.env.TELEGRAM_LOGIN_CLIENT_ID,
              TELEGRAM_LOGIN_CLIENT_SECRET: process.env.TELEGRAM_LOGIN_CLIENT_SECRET,
              LECTURE_STORAGE_DIR: `${privateDir}/lectures`,
              RUN_LECTURE_WORKER: process.env.RUN_LECTURE_WORKER,
              FFMPEG_PATH: process.env.FFMPEG_PATH || (process.env.ADMIN_SITE === "admin.test.brandmasterskaya.ru" ? `${home}/apps/${process.env.ADMIN_SITE}/media/ffmpeg` : ""),
              SHAKA_PACKAGER_PATH: process.env.SHAKA_PACKAGER_PATH || (process.env.ADMIN_SITE === "admin.test.brandmasterskaya.ru" ? `${home}/apps/${process.env.ADMIN_SITE}/media/packager` : ""),
            }));
          ' "$(ssh -i ~/.ssh/deploy_key "$SERVER" 'echo $HOME')" > env.json
          ssh -i ~/.ssh/deploy_key "$SERVER" \
            "mkdir -p private/$ADMIN_SITE && chmod 700 private/$ADMIN_SITE && umask 077 && cat > private/$ADMIN_SITE/env.json" < env.json
          rm env.json

      - name: Upload app
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER" "mkdir -p apps/$ADMIN_SITE/app"
          rsync -az --checksum --delete -e "ssh -i ~/.ssh/deploy_key" bundle/ "$SERVER:apps/$ADMIN_SITE/app/"

      # The web root holds only the Passenger entry; the reg.ru placeholder page goes away.
      - name: Upload Passenger entry
        run: |
          printf 'PassengerEnabled On\n' > deploy/.htaccess
          rsync -az -e "ssh -i ~/.ssh/deploy_key" deploy/passenger_wsgi.py deploy/.htaccess "$SERVER:www/$ADMIN_SITE/"
          ssh -i ~/.ssh/deploy_key "$SERVER" "rm -f www/$ADMIN_SITE/index.html && mkdir -p www/$ADMIN_SITE/tmp"

      # The landing page keeps its own document root and PHP APIs. Only /cabinet uses the socket.
      - name: Upload same-domain cabinet gateway
        run: |
          SERVER_HOME=$(ssh -i ~/.ssh/deploy_key "$SERVER" 'printf "%s" "$HOME"')
          SOCKET_PATH="$SERVER_HOME/private/$ADMIN_SITE/app.sock" SITE_ORIGIN="https://$SITE" ADMIN_ORIGIN="https://$ADMIN_SITE" php -r '
            echo "<?php\nreturn " . var_export([
              "socketPath" => getenv("SOCKET_PATH"),
              "siteOrigin" => getenv("SITE_ORIGIN"),
              "adminOrigin" => getenv("ADMIN_ORIGIN"),
            ], true) . ";\n";
          ' > cabinet-proxy.php
          ssh -i ~/.ssh/deploy_key "$SERVER" "mkdir -p private/$SITE www/$SITE/cabinet && umask 077 && cat > private/$SITE/cabinet-proxy.php" < cabinet-proxy.php
          rm cabinet-proxy.php
          rsync -az -e "ssh -i ~/.ssh/deploy_key" ../src/cabinet/ "$SERVER:www/$SITE/cabinet/"

      # Stops the old Node process and the Python proxy; the next request starts the new version
      # and applies database migrations.
      - name: Restart
        run: |
          ssh -i ~/.ssh/deploy_key "$SERVER" "
            kill \$(cat private/$ADMIN_SITE/app.pid 2>/dev/null) 2>/dev/null || true
            touch www/$ADMIN_SITE/tmp/restart.txt"
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -m 60 "https://$ADMIN_SITE/api/users/me" || true)
            echo "attempt $attempt: $status"
            [ "$status" = 200 ] && exit 0
            sleep 10
          done
          ssh -i ~/.ssh/deploy_key "$SERVER" "tail -30 private/$ADMIN_SITE/app.log"
          exit 1

      - name: Verify cabinet and landing page
        run: |
          curl --fail --silent --show-error --max-time 60 "https://$SITE/cabinet/" -o cabinet-smoke.html
          ASSET_PATH=$(node -e '
            const html = require("node:fs").readFileSync("cabinet-smoke.html", "utf8");
            const asset = html.match(/src="(\/cabinet\/_next\/static\/[^" ]+\.js)"/);
            if (!html.includes("Личный кабинет") || !asset) process.exit(1);
            process.stdout.write(asset[1]);
          ')
          curl --fail --silent --show-error --max-time 60 "https://$SITE$ASSET_PATH" -o /dev/null
          curl --fail --silent --show-error --max-time 60 "https://$SITE/" -o /dev/null
          rm cabinet-smoke.html

      - name: Verify media worker configuration
        if: github.ref != 'refs/heads/main'
        run: ssh -i ~/.ssh/deploy_key "$SERVER" "python3 - '$ADMIN_SITE'" < deploy/read-media-status.py

      # Brings the app back after a server reboot: a request starts it through Passenger.
      - name: Keep-alive cron
        run: |
          line="*/5 * * * * curl -s -o /dev/null -m 60 https://$ADMIN_SITE/api/users/me"
          ssh -i ~/.ssh/deploy_key "$SERVER" "(crontab -l 2>/dev/null | grep -vF 'https://$ADMIN_SITE/'; echo '$line') | crontab -"

  login-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostics_only == true && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: admin-test
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Read bounded login diagnostics
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "python3 - '$ADMIN_SITE'" < admin/deploy/read-login-diagnostics.py

      - name: Read bounded media status
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" "python3 - '$ADMIN_SITE'" < admin/deploy/read-media-status.py
