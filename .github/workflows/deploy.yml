# Builds the site and deploys dist/ to reg.ru hosting:
# - push to main -> brandmasterskaya.ru (live);
# - push to any other branch -> test.brandmasterskaya.ru (test, token prices, hidden from search).
name: Deploy

on:
  push:
    # Only changes that can affect the built site trigger a deploy.
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'config.example.php'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Read-only token: jobs only check out code; deploys use their own secrets.
permissions:
  contents: read

env:
  LIVE: ${{ github.ref == 'refs/heads/main' }}
  # Site folder under ~/www/ and its domain.
  SITE: ${{ github.ref == 'refs/heads/main' && 'brandmasterskaya.ru' || 'test.brandmasterskaya.ru' }}

concurrency:
  # One deploy per site at a time; branches share the test site, the last push wins.
  group: deploy-${{ github.ref == 'refs/heads/main' && 'live' || 'test' }}
  cancel-in-progress: false

jobs:
  deploy:
    # Dependabot gets no repository secrets, so its branches cannot deploy; the checks still run.
    if: github.actor != 'dependabot[bot]'
    # Shows each deploy under Deployments on GitHub: site, live from main, test from other branches.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'test' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://brandmasterskaya.ru' || 'https://test.brandmasterskaya.ru' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Same checks as the pre-commit hook, in case it was bypassed.
      - name: Lint and format check
        run: npm run check

      - name: Build
        run: npm run build

      # The test site must not show up in search results.
      - name: Hide test site from search engines
        if: env.LIVE != 'true'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Payment settings for src/api/lib.php, outside the web root (~/private/<site>/).
      # var_export quotes the secrets safely; they never appear in the log.
      - name: Write payment config
        env:
          TOCHKA_JWT: ${{ secrets.TOCHKA_JWT }}
          TOCHKA_CUSTOMER_CODE: ${{ secrets.TOCHKA_CUSTOMER_CODE }}
          TOCHKA_MERCHANT_ID: ${{ secrets.TOCHKA_MERCHANT_ID }}
          # Dolyame: Basic credentials, and the mTLS certificate and key written beside config.php.
          DOLYAME_LOGIN: ${{ secrets.DOLYAMI_MASTERSKAYA_LOGIN }}
          DOLYAME_PASSWORD: ${{ secrets.DOLYAMI_MASTERSKAYA_PASS }}
          DOLYAME_CERT: ${{ secrets.DOLYAME_CERT }}
          DOLYAME_KEY: ${{ secrets.DOLYAME_KEY }}
          # The bot from admin/ the thank-you page links to; the test site has its own bot,
          # so tests never touch real buyers' chats.
          TELEGRAM_BOT_USERNAME: ${{ github.ref == 'refs/heads/main' && 'masterskaya_brand_strategy_bot' || 'masterskaya_brand_test_bot' }}
        run: |
          php -r 'echo "<?php\n// Written by the deploy workflow; edits are overwritten.\nreturn " . var_export([
            "tochka_jwt" => getenv("TOCHKA_JWT"),
            "customer_code" => getenv("TOCHKA_CUSTOMER_CODE"),
            "merchant_id" => getenv("TOCHKA_MERCHANT_ID"),
            "telegram_bot_username" => getenv("TELEGRAM_BOT_USERNAME"),
            "site_url" => "https://" . getenv("SITE"),
            // A copy of every paid order lands in this mailbox as a backup.
            "notify_email" => "noreply@brandmasterskaya.ru",
            "dolyame_login" => getenv("DOLYAME_LOGIN"),
            "dolyame_password" => getenv("DOLYAME_PASSWORD"),
          ], true) . ";\n";' > config.php
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p private/$SITE && chmod 700 private private/$SITE && umask 077 && cat > private/$SITE/config.php" < config.php
          rm config.php
          # Without the certificate the site has no Dolyame button.
          if [ -n "$DOLYAME_CERT" ] && [ -n "$DOLYAME_KEY" ]; then
            printf '%s\n' "$DOLYAME_CERT" | ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "umask 077 && cat > private/$SITE/dolyame-cert.pem"
            printf '%s\n' "$DOLYAME_KEY" | ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "umask 077 && cat > private/$SITE/dolyame-key.pem"
          fi

      # --delete keeps the server in sync with the repo; .well-known and .htaccess
      # are excluded so Let's Encrypt challenges and panel-managed rules survive.
      # --checksum compares content, not mtime, so an identical build uploads nothing.
      - name: Sync files
        run: |
          rsync -avz --checksum --delete \
            --exclude '.well-known/' \
            --exclude '.htaccess' \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:www/$SITE/"
