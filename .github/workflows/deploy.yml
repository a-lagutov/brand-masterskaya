# Builds the site and deploys dist/ to brandmasterskaya.ru (reg.ru hosting) on every push to main.
name: Deploy

on:
  push:
    branches: [main]
    # Only changes that can affect the built site trigger a deploy.
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Same checks as the pre-commit hook, in case it was bypassed.
      - name: Lint and format check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # --delete keeps the server in sync with the repo; .well-known and .htaccess
      # are excluded so Let's Encrypt challenges and panel-managed rules survive.
      # --checksum compares content, not mtime, so an identical build uploads nothing.
      - name: Sync files
        run: |
          rsync -avz --checksum --delete \
            --exclude '.well-known/' \
            --exclude '.htaccess' \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:www/brandmasterskaya.ru/"
