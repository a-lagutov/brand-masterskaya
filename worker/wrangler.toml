# Telegram relay for the bots, see worker/telegram-relay.js.
# Deploy: cd worker && npx wrangler deploy
name = "brandmasterskaya-telegram"
main = "telegram-relay.js"
compatibility_date = "2026-09-01"

# Bot id (the part of the token before the colon) -> the site's bot.php that gets its
# webhook calls. Only these bots can use the relay.
[vars.BOTS]
# @masterskaya_brand_strategy_bot, the live site.
8392488542 = "https://brandmasterskaya.ru/api/bot.php"
# @masterskaya_brand_test_bot, the test site.
8577017424 = "https://test.brandmasterskaya.ru/api/bot.php"
