<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" xml:lang="ru" aria-describedby="beeline-desc" aria-labelledby="beeline-title" viewBox="0 0 1479 292"><title>Логотип билайн</title><desc>Жёлто-чёрный полосатый шар слева и тёмная строчная надпись «билайн» справа. Горизонтальный логотип без слогана, на прозрачном фоне.</desc><metadata><rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description><dc:title><rdf:Alt><rdf:li xml:lang="ru">Логотип билайн</rdf:li><rdf:li xml:lang="en">beeline logo</rdf:li></rdf:Alt></dc:title><dc:description><rdf:Alt><rdf:li xml:lang="ru">Жёлто-чёрный полосатый шар и строчная надпись «билайн». Горизонтальная версия без слогана, прозрачный фон. Векторная реконструкция по PNG; не официальный мастер-файл.</rdf:li><rdf:li xml:lang="en">Yellow-and-black striped sphere and lowercase Cyrillic wordmark «билайн». Horizontal version without a slogan, transparent background. Vector reconstruction from PNG; not an official master file.</rdf:li></rdf:Alt></dc:description><dc:format>image/svg+xml</dc:format><dc:subject rdf:resource="http://www.wikidata.org/entity/Q402880"/><dc:relation rdf:resource="http://www.wikidata.org/entity/Q1562664"/><dc:relation rdf:nodeID="identity2021"/></rdf:Description><rdf:Description rdf:nodeID="identity2021"><dc:title xml:lang="en">beeline: Russian brand identity, publicly unveiled on 14 October 2021</dc:title><dc:date rdf:datatype="http://www.w3.org/2001/XMLSchema#date">2021-10-14</dc:date><dc:coverage rdf:resource="http://www.wikidata.org/entity/Q159"/><dc:creator>Contrapunto</dc:creator><dc:contributor xml:lang="en">Contrast Foundry — typography and wordmark</dc:contributor><dc:relation rdf:nodeID="identity2005"/><dc:relation rdf:resource="https://kuban.plus.rbc.ru/pressrelease/616815007a8aa9561fe53700"/><dc:relation rdf:resource="https://contrastfoundry.com/projects/beeline"/></rdf:Description><rdf:Description rdf:nodeID="identi